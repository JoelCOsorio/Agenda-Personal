<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Atempo">
  <!-- Cuerpo principal del calendario -->
  <rect x="20" y="40" width="216" height="196" rx="34" fill="#FFFFFF" stroke="#312E81" stroke-width="12"/>

  <!-- Cabecera superior del calendario -->
  <path d="M 20,74 Q 20,40 54,40 L 202,40 Q 236,40 236,74 L 236,102 L 20,102 Z" fill="#312E81"/>

  <!-- Anillas minimalistas superiores -->
  <rect x="74" y="16" width="20" height="44" rx="10" fill="#4F46E5" stroke="#FFFFFF" stroke-width="5"/>
  <rect x="162" y="16" width="20" height="44" rx="10" fill="#4F46E5" stroke="#FFFFFF" stroke-width="5"/>

  <!-- Cuadricula minimalista de dias (3x2) -->
  <rect x="46" y="124" width="44" height="36" rx="9" fill="#E0E7FF"/>
  <rect x="106" y="124" width="44" height="36" rx="9" fill="#E0E7FF"/>
  <rect x="166" y="124" width="44" height="36" rx="9" fill="#E0E7FF"/>

  <rect x="46" y="176" width="44" height="36" rx="9" fill="#E0E7FF"/>
  <!-- Dia activo con marca de tarea completada -->
  <rect x="106" y="176" width="44" height="36" rx="9" fill="#4F46E5"/>
  <path d="M 118,194 L 125,201 L 139,187" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="166" y="176" width="44" height="36" rx="9" fill="#E0E7FF"/>

  <!-- Indicador minimalista de notificacion activa -->
  <circle cx="216" cy="52" r="20" fill="#F59E0B" stroke="#FFFFFF" stroke-width="6"/>
</svg>
