name: CI - Pruebas Automatizadas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  UV_PYTHON: "3.14"
  PYTHONUTF8: "1"

jobs:
  test:
    name: Pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      - name: Configurar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Ejecutar pruebas unitarias e integración SQLite
        run: uv run pytest tests/unit tests/integration -v
