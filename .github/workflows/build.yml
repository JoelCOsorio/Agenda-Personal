name: Build Multiplataforma (Android, Linux, Windows)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  UV_PYTHON: "3.14"
  PYTHONUTF8: "1"

jobs:
  test:
    name: Verificar pruebas antes de compilar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      - name: Configurar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Ejecutar suite de pruebas
        run: uv run pytest tests/unit tests/integration -v

  build:
    name: Compilar ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: apk
            runner: ubuntu-latest
          - target: linux
            runner: ubuntu-latest
          - target: windows
            runner: windows-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v6

      - name: Compilar aplicación con Flet
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: ${{ matrix.target }}
          runner-python-version: "3.14"
          bundled-python-version: "3.14"
          build-number: ${{ github.run_number }}

      - name: Subir artefacto compilado
        uses: actions/upload-artifact@v7
        with:
          name: atempo-${{ matrix.target }}
          path: ${{ steps.build.outputs.archive-path }}
          if-no-files-found: error
          overwrite: false

  release:
    name: Publicar GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Descargar artefactos compilados
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**/*
